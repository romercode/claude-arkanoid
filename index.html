<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkanoid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <div class="hud">
      <div class="hud__item">
        <span class="hud__label">Puntuación</span>
        <span class="hud__value" id="score">0</span>
      </div>
      <div class="hud__item">
        <span class="hud__label">Récord</span>
        <span class="hud__value" id="record">0</span>
      </div>
      <div class="hud__item">
        <span class="hud__label">Nivel</span>
        <span class="hud__value" id="level">1/5</span>
      </div>
      <div class="hud__item hud__item--lives">
        <span class="hud__label">Vidas</span>
        <span class="hud__lives" id="lives" role="img" aria-label="3 vidas"></span>
      </div>
    </div>
    <canvas id="game" width="800" height="600"></canvas>
  </main>
  <script src="assets/spritesheet.js"></script>
  <script src="game.js"></script>
</body>
</html>
